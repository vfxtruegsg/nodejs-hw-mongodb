tags:
  - Auth
summary: Register user
operationId: registerUser
description: 'User registration in the application'
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            description: "User's name"
            type: string
            example: 'John Doe'
          email:
            description: "User's email"
            type: string
            example: 'qwerty123@gmail.com'
          password:
            description: "User's password"
            type: string
            example: 'fdaSfa4ld'
responses:
  '201':
    description: Creates a user profile
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully registered a user!
            data:
              type: object
              $ref: '../../components/schemas/users.yaml'
  '400':
    $ref: ../../components/responses/400.yaml
  '500':
    $ref: '../../components/responses/500.yaml'
